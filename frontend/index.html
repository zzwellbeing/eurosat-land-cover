<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>卫星影像地表分类</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/script.js"></script>
</head>
<body>
  <main>
    <header>
      <span class="eyebrow">EuroSAT · Sentinel-2</span>
      <h1>卫星影像地表分类</h1>
      <p>上传一张 RGB 遥感影像，识别森林、河流、住宅区等十种地表类型。</p>
      <p class="model" id="model">正在加载模型状态…</p>
    </header>
    <div class="workspace">
      <section class="panel" aria-labelledby="upload-title">
        <h2 id="upload-title">上传影像</h2>
        <label class="upload" id="upload-zone" for="image">
          <img id="preview" alt="待分类影像" hidden>
          <span id="placeholder">点击选择图片<br><small>JPG、PNG 或 WebP，最大 5 MB</small></span>
        </label>
        <input type="file" id="image" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp">
        <p id="filename" class="filename">请选择一张影像</p>
        <div class="actions">
          <button type="button" id="predict" disabled>开始预测</button>
          <button type="button" class="muted" id="reset" disabled>重新选择</button>
        </div>
      </section>
      <section class="panel" aria-labelledby="result-title">
        <h2 id="result-title">预测结果</h2>
        <p id="status" role="status" aria-live="polite">等待上传影像。</p>
        <div id="result" hidden>
          <div class="top">
            <div><span class="hint">首选类别</span><strong id="top-label"></strong></div>
            <div><span class="hint">模型置信度</span><strong id="top-score"></strong></div>
          </div>
          <p class="timing">模型推理耗时 <span id="timing"></span></p>
          <h3>Top-3 预测</h3>
          <ol id="ranks"></ol>
        </div>
      </section>
    </div>
    <footer>模型基于 EuroSAT RGB 训练。输入宜为与训练图像尺度相近的卫星影像。数据来源为 EuroSAT 与 Copernicus Sentinel-2。</footer>
  </main>
</body>
</html>
